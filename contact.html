<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact me</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  </head>
  <body>
    <section class="form-section">
      <h3>Contact Me</h3>
      <form id="contact-form">
        <div class="form-row">
          <input type="text" id="name" placeholder="Full Name" required />
          <input type="number" id="age" placeholder="Age" required />
        </div>
        <div class="form-row">
          <input type="email" id="email" placeholder="Email Address" required />
        </div>
        <textarea
          id="comment"
          placeholder="Write your questions or comments here..."
          rows="5"
        ></textarea>
        <button type="submit">Submit Message</button>
      </form>
    </section>
    <script>
    const supabaseUrl = 'https://nynzqvazavclibaicymd.supabase.co';
    const supabaseKey = 'sb_publishable_2r8EkDOZhv_XdFK-OfRX-g_mvRCOAc-';
    const client = supabase.createClient(supabaseUrl, supabaseKey);

      async function signInWithGithub() {
        const { data, error } = await client.auth.signInWithOAuth({
          provider: 'github',
          options: {
            redirectTo: 'https://pdplsh.github.io/Keiin_lecture/',
          },
        });
      }
      const form = document.getElementById('contact-form');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();

        const name = document.getElementById('name').value;
        const age = document.getElementById('age').value;
        const email = document.getElementById('email').value;
        const comment = document.getElementById('comment').value;

        const { data, error } = await client.from('comment').insert([
          {
            name: name,
            age: parseInt(age),
            email: email,
            comment: comment,
          },
        ]);

        if (error) {
          console.error('Error:', error.message);
          alert('Error: ' + error.message);
        } else {
          alert('Sucess!');
          form.reset();
        }
      });
    </script>
  </body>
</html>
