<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Personal Homepage</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  </head>
  <body>
    <header>
      <a href="index.html" class="home-btn">🏠 Home</a>
      <h1><a href="index.html">Welcome to Sunghyun Lee's Space</a></h1>
    </header>

    <div class="container">
      <nav class="sidebar">
        <ul>
          <li><a href="hobby.html" target="content-frame">My Hobbies</a></li>
          <li>
            <a href="to_do.html" target="content-frame">Monthly To-Do Lists</a>
          </li>
          <li>
            <a href="video.html" target="content-frame">Featured Video</a>
          </li>
          <li>
            <a href="picture.html" target="content-frame">Favorite Pictures</a>
          </li>
          <li>
            <a href="contact.html" target="content-frame">Contact Me</a>
          </li>
        </ul>
        <div class="log">
          <input type="button" value="login" id="login" />
          <input type="button" value="logout" id="logout" />
        </div>
      </nav>

      <main class="content" id="main-content">
        <iframe src="welcome.html" name="content-frame"></iframe>
      </main>
    </div>
    
    <script>
    const supabaseUrl = 'https://nynzqvazavclibaicymd.supabase.co';
    const supabaseKey = 'sb_publishable_2r8EkDOZhv_XdFK-OfRX-g_mvRCOAc-';
    const client = supabase.createClient(supabaseUrl, supabaseKey);

      async function signInWithGithub() {
        const { data, error } = await client.auth.signInWithOAuth({
          provider: 'github',
          options: {
            redirectTo: 'https://pdplsh.github.io/Keiin_lecture/',
          },
        });
      }
      document
        .querySelector('#login')
        .addEventListener('click', signInWithGithub);

      async function checkLogin() {
        const authInfo = await client.auth.getSession();
        const session = authInfo.data.session;
        document.querySelector('#login').style.display = 'none';
        document.querySelector('#logout').style.display = 'none';
        if (session === null) {
          document.querySelector('#login').style.display = 'inline';
        } else {
          document.querySelector('#logout').style.display = 'inline';
        }
      }
      checkLogin();
      async function signOut() {
        const { error } = await client.auth.signOut();
        checkLogin();
      }
      document.querySelector('#logout').addEventListener('click', signOut);

      const form = document.getElementById('contact-form');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();

        const name = document.getElementById('name').value;
        const age = document.getElementById('age').value;
        const email = document.getElementById('email').value;
        const comment = document.getElementById('comment').value;

        const { data, error } = await client.from('comment').insert([
          {
            name: name,
            age: parseInt(age),
            email: email,
            comment: comment,
          },
        ]);

        if (error) {
          console.error('Error:', error.message);
          alert('Error: ' + error.message);
        } else {
          alert('Sucess!');
          form.reset();
        }
      });
    </script>
  </body>
</html>
